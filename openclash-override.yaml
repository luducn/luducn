proxy-providers:
  socks5_chain:
    type: http
    url: "https://raw.githubusercontent.com/luducn/luducn/refs/heads/main/socks5-chain.yaml"
    path: ./proxy-providers/socks5-chain.yaml
    interval: 86400
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

proxy-groups:
  - name: 🔁 SOCKS5中转
    type: select
    use:
      - socks5_chain
    proxies:
      - 🚀 节点选择
